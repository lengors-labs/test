---
name: Publish new version

on:
  push:
    branches:
      - main
      - rc
  # Publishes a preview for a single topic branch. The branch must already be
  # listed in `.releaserc.js`, which is what gives the run its `preview-…`
  # prerelease identifier and `preview` channel.
  workflow_dispatch:

jobs:
  publish-new-version:
    name: Publish new version
    runs-on: ubuntu-latest
    environment: publisher
    # A dispatch is only meaningful on a topic branch; without this guard the
    # dropdown would also offer `main` and `rc`, which already release on push.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      startsWith(github.ref_name, 'feat/') ||
      startsWith(github.ref_name, 'bug/') ||
      startsWith(github.ref_name, 'chore/')
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Create GitHub app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # semantic-release pushes a lightweight tag and a git note, neither of which is
      # signed, so no signing key is imported. The only commit this job writes is the
      # note, and it is attributed to the app that actually performed the release.
      - name: Resolve app identity
        id: app-identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          resp=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${APP_SLUG}%5Bbot%5D") \
            || { echo "::error::No bot user for app slug '${APP_SLUG}'"; exit 1; }
          id=$(printf '%s' "$resp" \
            | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]\+' \
            | head -n1 | grep -o '[0-9]\+$') || true
          if [ -z "${id:-}" ]; then
            echo "::error::Could not parse the bot id for app slug '${APP_SLUG}'"
            exit 1
          fi
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Publish version
        uses: cycjimmy/semantic-release-action@v4
        id: semantic-release
        with:
          # semantic-release bundles none of these, so they are installed here.
          extra_plugins: |
            semantic-release-gitmoji
            @jno21/semantic-release-github-commit
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Deliberately no GIT_AUTHOR_* / GIT_COMMITTER_* overrides: the commit
          # API reads any custom identity as an opt-out of GitHub's signature.

      # The plugin rewrites `origin` to an inline-auth URL and never reverts it,
      # so the installation token is left in .git/config for the rest of the job.
      - name: Scrub the token from the git remote
        if: always()
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://github.com/${{ github.repository }}.git"
